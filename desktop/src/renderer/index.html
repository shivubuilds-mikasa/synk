<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Synk Desktop</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .container { text-align: center; padding: 2rem; }
    h1 { font-size: 3rem; margin-bottom: 1rem; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { font-size: 1.2rem; color: #888; }
    .status { margin-top: 2rem; padding: 1rem; background: rgba(255,255,255,0.05); border-radius: 8px; font-family: monospace; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Synk Desktop</h1>
    <p>Electron + TypeScript scaffold ready</p>
    <div class="status" id="status">Waiting for preload...</div>
  </div>
  <script>
    // Wait for preload to expose API
    window.addEventListener('DOMContentLoaded', async () => {
      const status = document.getElementById('status');
      try {
        const result = await window.api.ping();
        status.textContent = `✓ Preload working: ${result}`;
        status.style.color = '#4ade80';
      } catch (e) {
        status.textContent = `✗ Preload error: ${e}`;
        status.style.color = '#f87171';
      }
    });
  </script>
</body>
</html>
