name: synk_mobile
description: "Synk mobile client - cross-device clipboard synchronization"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Network
  http: ^1.3.0

  # WebSocket support
  web_socket_channel: ^3.0.0

  # Clipboard access
  clipboard: ^0.1.3

  # Secure storage for tokens
  flutter_secure_storage: ^9.2.2

  # State management (lightweight)
  provider: ^6.1.2

  # JSON serialization
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # UI
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.5
  build_runner: ^2.4.13
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
