version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    
    container_name: synk-postgres
    environment:
      POSTGRES_USER: synk
      POSTGRES_PASSWORD: synk
      POSTGRES_DB: synk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synk"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: synk-postgres-test
    environment:
      POSTGRES_USER: synk
      POSTGRES_PASSWORD: synk
      POSTGRES_DB: synk_test
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synk"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data:
